name: Rust

on:
  pull_request:
  push:
    branches: [main]
    tags: ["rust-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: "1.88.0"
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Preserve fixture bytes on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
        working-directory: ${{ runner.temp }}
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test --locked

  package:
    name: lint, docs and package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify Rust tag version
        if: startsWith(github.ref, 'refs/tags/rust-v')
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "${GITHUB_REF_NAME#rust-v}" = "$package_version"
      - run: cargo package --locked
      - name: Test the unpacked crate
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          cargo test --locked --manifest-path "target/package/defuddle-$package_version/Cargo.toml" --target-dir target/package-tests
